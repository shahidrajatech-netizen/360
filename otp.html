<!doctype html>
<html lang="en">
  <head>
    <title>Verify OTP</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: "Playfair Display", serif;
      }

      body {
        margin: 0;
        background: url("bg.jpg") no-repeat center/cover;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        top: 0;
        left: 0;
      }

      .container {
        position: relative;
        padding: 30px;
        border-radius: 10px;
        background: white;
        width: 300px;
        text-align: center;
      }

      h1 {
        margin-bottom: 10px;
      }

      p {
        font-size: 14px;
        margin-bottom: 10px;
      }

      input,
      button {
        width: 100%;
        padding: 10px;
        margin: 6px 0;
        border: 1px solid black;
      }

      button {
        background: black;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: white;
        color: black;
      }

      a {
        display: block;
        margin-top: 10px;
        color: #0066cc;
        text-decoration: none;
        font-size: 14px;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>VERIFY OTP</h1>
      <p>Enter OTP sent to your email</p>

      <form action="reset.html">
        <label for="otp-input">Enter OTP</label>
        <input id="otp-input" type="text" placeholder="Enter OTP" required />
        <button type="submit">Verify OTP</button>
      </form>

      <a href="forgot.html">Back</a>
    </div>
  </body>
</html>
