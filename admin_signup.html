<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Registration</title>

    <style>
      body {
        margin: 0;
        font-family: "Playfair Display", serif;
        background: url("bg.jpg") no-repeat center/cover;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        width: 420px;
        text-align: center;
      }

      h1 {
        margin-bottom: 15px;
      }

      label {
        display: block;
        text-align: left;
        margin-top: 10px;
        font-size: 14px;
      }

      input,
      textarea,
      button {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid black;
        box-sizing: border-box;
      }

      textarea {
        height: 80px;
      }

      button {
        background: black;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: #333;
      }

      a {
        display: block;
        margin-top: 10px;
        color: #0066cc;
        text-decoration: none;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Admin Registration</h1>

      <form>
        <label for="full-name">Full Name</label>
        <input
          id="full-name"
          name="fullName"
          type="text"
          placeholder="Full Name"
          required
        />

        <label for="admin-id">Admin ID</label>
        <input
          id="admin-id"
          name="adminId"
          type="text"
          placeholder="Admin ID"
          required
        />

        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Email"
          required
        />

        <label for="phone">Phone Number</label>
        <input
          id="phone"
          name="phone"
          type="tel"
          placeholder="Phone Number"
          pattern="[0-9]{10}"
          required
        />

        <label for="address">Address</label>
        <textarea
          id="address"
          name="address"
          placeholder="Address"
          required
        ></textarea>

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Password"
          required
        />

        <button type="submit">Register</button>
      </form>

      <a href="login.html">Back to Login</a>
    </div>
  </body>
</html>
