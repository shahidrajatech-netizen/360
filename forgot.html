<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: "Playfair Display", serif;
      }

      body {
        margin: 0;
        background: url("bg.jpg") no-repeat center/cover;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        top: 0;
        left: 0;
      }

      .container {
        position: relative;
        padding: 30px;
        border-radius: 10px;
        background: white;
        width: 300px;
        text-align: center;
      }

      h1 {
        margin-bottom: 15px;
      }

      p {
        font-size: 14px;
        margin-bottom: 10px;
      }

      input,
      button {
        width: 100%;
        padding: 10px;
        margin: 6px 0;
        border: 1px solid black;
      }

      button {
        background: black;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: white;
        color: black;
      }

      a {
        display: block;
        margin-top: 10px;
        color: #0066cc;
        text-decoration: none;
        font-size: 14px;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>FORGOT PASSWORD</h1>

      <p>Enter your registered email ID</p>

      <form action="otp.html">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Enter Email"
          required
        />
        <button type="submit">Send OTP</button>
      </form>

      <a href="login.html">Back to Login</a>
    </div>
  </body>
</html>
